<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor Celular - Rosa Neón</title>
  <style>
    /* Estilos Generales */
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    /* Contenedor de la Rosa 3D en el fondo */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1; /* Al fondo */
    }

    /* Contenedor del Reproductor Flotante */
    .player-wrapper {
      position: absolute;
      bottom: 40px; 
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(20, 20, 20, 0.6); 
      backdrop-filter: blur(12px); 
      border-radius: 20px;
      padding: 20px;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.1); 
      z-index: 2; /* Por encima del canvas */
    }

    /* Fila superior: Portada y Textos */
    .top-row {
      display: flex;
      align-items: center;
      margin-bottom: 25px;
    }

    .album-art {
      width: 110px;
      height: 110px;
      border-radius: 10px;
      object-fit: cover;
      margin-right: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .track-info {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .song-title {
      font-size: 22px;
      font-weight: bold;
      margin: 0 0 4px 0;
    }

    .artist-name {
      font-size: 14px;
      color: #b3b3b3;
      margin: 0 0 12px 0;
    }

    .extras-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .heart-icon {
      font-size: 22px;
      cursor: pointer;
      color: #b3b3b3;
      transition: color 0.2s;
    }
    
    .heart-icon:hover, .heart-icon.liked {
      color: #1db954;
    }

    .spotify-wave {
      font-size: 14px;
      letter-spacing: 2px;
      color: #ffffff;
      font-weight: bold;
    }

    /* Barra de Progreso */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #a7a7a7;
      margin-bottom: 25px;
    }

    .progress-bar {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: #535353;
      border-radius: 2px;
      outline: none;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    /* Fila de Controles */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 10px;
    }

    .btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.2s, color 0.2s;
      padding: 0;
    }

    .btn-secondary {
      color: #b3b3b3;
      font-size: 18px;
    }

    .btn:active {
      transform: scale(0.9);
    }

    .btn-play {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #ffffff; 
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
  </style>

  <!-- MAPA DE IMPORTACIÓN: Esto arregla el error de los módulos 3D -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Fondo 3D -->
  <div id="bg-canvas"></div>

  <!-- Reproductor estilo Spotify -->
  <div class="player-wrapper">
    <div class="top-row">
      <img src="portada.jpeg" alt="Portada" class="album-art">
      <div class="track-info">
        <h2 class="song-title">Khe,    Para ti Liz</h2>
        <p class="artist-name">Rauw Alejandro & Romeo Santos</p>
        <div class="extras-row">
          <span class="heart-icon" id="heart-btn">♡</span>
          <span class="spotify-wave">|||ı|ı||ı|</span>
        </div>
      </div>
    </div>

    <div class="progress-row">
      <span id="current-time">0:00</span>
      <input type="range" class="progress-bar" id="progress-bar" value="0" step="1">
      <span id="duration">0:00</span>
    </div>

    <div class="controls-row">
      <button class="btn btn-secondary">🔀</button>
      <button class="btn">⏮</button>
      <button class="btn btn-play" id="play-btn">▶</button>
      <button class="btn">⏭</button>
      <button class="btn btn-secondary">🔁</button>
    </div>

    <audio id="audio-player" src="cancion.mp3"></audio>
  </div>

  <!-- SCRIPT 1: LÓGICA DEL REPRODUCTOR (Separado para que no falle) -->
  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const heartBtn = document.getElementById('heart-btn');

    let isPlaying = false;

    // Botón Play/Pause
    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        playBtn.innerHTML = '▶';
      } else {
        audio.play();
        playBtn.innerHTML = '⏸';
      }
      isPlaying = !isPlaying;
    });

    // Botón de Corazón
    heartBtn.addEventListener('click', () => {
      heartBtn.classList.toggle('liked');
      heartBtn.innerHTML = heartBtn.classList.contains('liked') ? '♥' : '♡';
    });

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audio.addEventListener('loadedmetadata', () => {
      progressBar.max = audio.duration;
      durationEl.innerText = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', () => {
      progressBar.value = audio.currentTime;
      currentTimeEl.innerText = formatTime(audio.currentTime);
    });

    progressBar.addEventListener('input', () => {
      audio.currentTime = progressBar.value;
    });
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const container = document.getElementById('bg-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.04);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3.0, 20); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    container.appendChild(renderer.domElement);

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.5, 0.1);
    bloomPass.strength = 2.4; 
    bloomPass.radius = 0.6;
    bloomPass.threshold = 0.05;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    const masterGroup = new THREE.Group();
    scene.add(masterGroup);

    const roseGroup = new THREE.Group();
    
    const petalMaterial = new THREE.LineBasicMaterial({
      color: 0xffccdf, 
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    for (let layer = 0; layer < 22; layer++) {
      const points = [];
      const radius = 0.2 + Math.pow(layer * 0.12, 1.1);
      const petals = 5; 
      
      for (let t = 0; t <= Math.PI * 2.01; t += 0.02) {
        const shape = Math.pow(Math.abs(Math.sin((petals / 2) * t)), 0.5);
        const r = radius * shape;
        const x = r * Math.cos(t + layer * 0.05);
        const z = r * Math.sin(t + layer * 0.05);
        const y = Math.pow(r, 1.3) * 1.5 - (layer * 0.05); 
        points.push(new THREE.Vector3(x, y, z));
      }
      
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(geometry, petalMaterial);
      line.rotation.y = layer * (Math.PI / 1.618);
      roseGroup.add(line);
    }

    const coreGeo = new THREE.SphereGeometry(0.1, 16, 16);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const core = new THREE.Mesh(coreGeo, coreMat);
    roseGroup.add(core);

    const stemHeight = 3.5; 
    const stemGeo = new THREE.CylinderGeometry(0.15, 0.30, stemHeight, 16);
    const stemMat = new THREE.MeshBasicMaterial({ color: 0x88ff88, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending });
    const stem = new THREE.Mesh(stemGeo, stemMat);
    stem.position.y = -stemHeight / 2 + 0.1; 
    roseGroup.add(stem);

    const thornGeo = new THREE.ConeGeometry(0.08, 0.25, 4); 
    const thornMat = new THREE.MeshBasicMaterial({ color: 0x88ff88, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });

    for (let i = 0; i < 9; i++) { 
        const thornContainer = new THREE.Group();
        thornContainer.position.y = -0.3 - (i * 0.35); 
        thornContainer.rotation.y = i * (Math.PI * 0.75); 
        const thorn = new THREE.Mesh(thornGeo, thornMat);
        thorn.position.x = 0.25; 
        thorn.rotation.z = -Math.PI / 3; 
        thornContainer.add(thorn);
        roseGroup.add(thornContainer);
    }

    // --- AQUÍ SUBIMOS LA ROSA (Antes estaba en 1, ahora en 5.5) ---
    roseGroup.position.y = 5.5;
    masterGroup.add(roseGroup);

    const ringGeo = new THREE.TorusGeometry(2.5, 0.02, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.2;
    // --- AQUÍ SUBIMOS EL ANILLO PARA QUE ACOMPAÑE A LA ROSA ---
    ring.position.y = 5.5;
    masterGroup.add(ring);

    const butterflyCount = 25; 
    const butterflies = [];
    
    const wingShape = new THREE.Shape();
    wingShape.moveTo(0, 0);
    wingShape.quadraticCurveTo(0.2, 0.3, 0.4, 0.1);
    wingShape.quadraticCurveTo(0.3, -0.1, 0, 0);
    const wingGeo = new THREE.ShapeGeometry(wingShape);
    wingGeo.scale(1.5, 1.5, 1.5); 

    const butterflyMat = new THREE.MeshBasicMaterial({ 
        color: 0xff1053, side: THREE.DoubleSide, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending
    });

    for (let i = 0; i < butterflyCount; i++) {
      const bContainer = new THREE.Group();
      const leftWing = new THREE.Mesh(wingGeo, butterflyMat);
      const rightWing = new THREE.Mesh(wingGeo, butterflyMat);
      rightWing.rotation.x = Math.PI; 
      bContainer.add(leftWing);
      bContainer.add(rightWing);
      
      butterflies.push({ 
          mesh: bContainer, 
          leftWing: leftWing, 
          rightWing: rightWing,
          speedX: 0.1 + Math.random() * 0.2,
          speedY: 0.1 + Math.random() * 0.2,
          speedZ: 0.1 + Math.random() * 0.2,
          offsetX: Math.random() * Math.PI * 2,
          offsetY: Math.random() * Math.PI * 2,
          offsetZ: Math.random() * Math.PI * 2,
          radiusX: 5 + Math.random() * 10,
          radiusY: 4 + Math.random() * 8,
          radiusZ: 5 + Math.random() * 10,
      });
      scene.add(bContainer); 
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      masterGroup.rotation.y = time * 0.2;
      roseGroup.rotation.y = time * -0.1;

      butterflies.forEach((b) => {
        const currentX = Math.sin(time * b.speedX + b.offsetX) * b.radiusX;
        // --- AQUÍ SUBIMOS EL VUELO DE LAS MARIPOSAS (+ 5.5) ---
        const currentY = Math.cos(time * b.speedY + b.offsetY) * b.radiusY + 5.5;
        const currentZ = Math.sin(time * b.speedZ + b.offsetZ) * b.radiusZ;

        b.mesh.position.set(currentX, currentY, currentZ);

        const nextX = Math.sin((time + 0.1) * b.speedX + b.offsetX) * b.radiusX;
        const nextY = Math.cos((time + 0.1) * b.speedY + b.offsetY) * b.radiusY + 5.5;
        const nextZ = Math.sin((time + 0.1) * b.speedZ + b.offsetZ) * b.radiusZ;
        
        b.mesh.lookAt(nextX, nextY, nextZ);

        const flap = Math.abs(Math.sin(time * 15 + b.offsetX)) * 1.2;
        b.leftWing.rotation.y = flap;
        b.rightWing.rotation.y = -flap;
      });

      composer.render();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
  </script>
</body>
</html>
